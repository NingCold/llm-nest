[package]
name = "llmn-crypto"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
http = "1"
serde.workspace = true
serde_json.workspace = true
matrix-sdk-crypto = { version = "=0.19.1", default-features = false, features = ["experimental-send-custom-to-device"] }
