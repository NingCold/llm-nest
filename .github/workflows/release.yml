name: Build installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing client tag to create a draft release; leave empty for artifacts only'
        type: string
        required: false
      agent_manifest:
        description: 'Immutable HTTPS manifest URL for separately published Agent'
        type: string
        required: true
      agent_version:
        description: 'Exact Agent version from manifest'
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
      APPIMAGE_EXTRACT_AND_RUN: '1'
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Verify selected source
        id: source
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and tag
        run: |
          python scripts/release.py validate
          python scripts/test_release.py
          python scripts/test_build_artifacts.py
          node --test desktop/scripts/prepare-agent.test.mjs scripts/web-notices.test.cjs
      - name: Install toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
          npm install --global pnpm@11.22.0
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb xauth dbus-x11 libfuse2t64
      - name: Frontend checks
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
      - name: Rust and offline acceptance
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
      - name: Select fixed published Agent manifest
        env:
          AGENT_MANIFEST: ${{ inputs.agent_manifest }}
          AGENT_VERSION: ${{ inputs.agent_version }}
        run: |
          test -n "$AGENT_MANIFEST" && test -n "$AGENT_VERSION"
          echo "LLMN_AGENT_VERSION=$AGENT_VERSION" >> "$GITHUB_ENV"
          echo "LLMN_AGENT_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "LLMN_AGENT_MANIFEST=$AGENT_MANIFEST" >> "$GITHUB_ENV"
      - name: Install verified cargo-about 0.9.3
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            about_target=x86_64-pc-windows-msvc
            about_sha=9e2942533ef1c592c4a70bdb384cae1550a3f5fc9ae40379b6662e3d2f16fe02
            about_bin=cargo-about.exe
          else
            about_target=x86_64-unknown-linux-musl
            about_sha=3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
            about_bin=cargo-about
          fi
          curl --fail --location --proto '=https' "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-$about_target.tar.gz" --output cargo-about.tar.gz
          echo "$about_sha  cargo-about.tar.gz" | sha256sum --check
          mkdir cargo-about-bin
          tar -xzf cargo-about.tar.gz --strip-components=1 -C cargo-about-bin
          echo "CARGO_ABOUT=$GITHUB_WORKSPACE/cargo-about-bin/$about_bin" >> "$GITHUB_ENV"
      - name: Preserve the verified Agent ELF in AppImage resources
        if: runner.os == 'Linux'
        run: |
          # CLI 2.11.4's linuxdeploy scans all ELF resources under usr/lib and rewrites RPATH.
          # Its PATCHELF override lets this already-built Agent retain its verified manifest hash.
          cat > "$RUNNER_TEMP/llmn-patchelf" <<'SH'
          #!/usr/bin/env bash
          if [[ "$#" == 3 && "$1" == --set-rpath && "$3" == */usr/lib/"LLM Nest"/agent/llmn-agent ]]; then
            echo 'Preserving official Agent ELF bytes: skipping resource RPATH rewrite' >&2
            exit 0
          fi
          exec /usr/bin/patchelf "$@"
          SH
          chmod +x "$RUNNER_TEMP/llmn-patchelf"
          echo "PATCHELF=$RUNNER_TEMP/llmn-patchelf" >> "$GITHUB_ENV"
      - name: Build embedded desktop installers
        working-directory: desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}" --ci -- --locked
      - name: Check Windows icons and install identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/verify-windows-icons.ps1
          ./scripts/verify-windows-branding.ps1
      - name: Check packaged Linux startup
        if: runner.os == 'Linux'
        run: |
          python scripts/linux/smoke.py --deb target/${{ matrix.target }}/release/bundle/deb/*.deb --gui
          python scripts/linux/smoke.py --appimage target/${{ matrix.target }}/release/bundle/appimage/*.AppImage --gui
      - name: Collect installers and checksums
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then extra+=(--appimage); fi
          python scripts/release.py collect --platform ${{ matrix.platform }} --bundle-dir target/${{ matrix.target }}/release/bundle --output release-assets "${extra[@]}"
      - name: Package versioned Web artifact
        if: runner.os == 'Linux'
        run: |
          pnpm --dir web build
          version=$(node -p "require('./web/package.json').version")
          python scripts/package-web.py --dist web/dist --output release-assets --version "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    # A supplied existing tag enables the draft after artifact verification.
    if: inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}
      - name: Verify release tag still names the built commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Assemble release checksums
        run: python3 scripts/release.py checksums release-assets
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          cat > release-notes.md <<'NOTES'
          LLM Nest 开发预览版。

          安装包和 SHA256SUMS.txt 由同一次构建生成。
          Windows x64：NSIS 安装器与 MSI；Linux x64：Ubuntu 24.04 基线的 deb 包与 AppImage。
          安装包不包含模型 API Key。Linux GUI、干净 Windows 和系统级 MSI 请按仓库验收清单检查。
          当前未配置系统代码签名或应用内自动更新。

          维护者：核对平台验收、许可证和产物后，再公开此草稿并补充版本变更说明。
          NOTES
          if gh release view "$tag" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            if [[ "$(cat is-draft.txt)" != true ]]; then
              echo 'Refusing to replace files in an already published release.' >&2
              exit 1
            fi
            gh release upload "$tag" release-assets/* --clobber
          else
            flags=()
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" release-assets/* --verify-tag --draft "${flags[@]}" --title "LLM Nest $tag" --notes-file release-notes.md
          fi
