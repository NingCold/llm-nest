name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust and pnpm
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          npm install --global pnpm@11.22.0
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Frontend
        run: |
          pnpm --dir client/web install --frozen-lockfile
          pnpm --dir client/desktop install --frozen-lockfile
          pnpm --dir client/web typecheck
          pnpm --dir client/web test
      - name: Rust checks
        run: |
          python scripts/check-boundaries.py
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked
      - name: Offline acceptance and release gates
        run: |
          cargo build -p web-server --locked
          python scripts/acceptance.py
          python scripts/social_acceptance.py
          python scripts/social_acceptance.py --only-image-capabilities
          python scripts/social_acceptance.py --only-files
          python scripts/release.py validate
          python scripts/test_release.py

  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TERM_COLOR: always
      CLOUD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/llmn_test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llmn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d llmn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust and PostgreSQL client dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Cloud PostgreSQL integration tests
        run: cargo test -p cloud-server --locked -- --nocapture
