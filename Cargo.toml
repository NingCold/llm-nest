[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/social",
    "crates/ai-client",
    "crates/events",
    "crates/runtime",
    "crates/tools",
    "crates/storage",
    "crates/web-server",
    "features/social",
    "frontends/tauri/src-tauri",
]

[workspace.package]
version = "0.1.1-alpha.3"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.dependencies.common]
path = "crates/common"

[workspace.dependencies.ai-client]
path = "crates/ai-client"

[workspace.dependencies.storage]
path = "crates/storage"

[workspace.dependencies.social]
path = "crates/social"
