[package]
name = "tauri-frontend"
version = "0.1.1-alpha.11"
edition.workspace = true
default-run = "LLM-Nest"

[[bin]]
name = "LLM-Nest"
path = "src/main.rs"

[lib]
name = "tauri_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
open = { version = "5", features = ["shellexecute-on-windows"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tokio-util.workspace = true
uuid.workspace = true
reqwest.workspace = true
base64.workspace = true
futures-util.workspace = true
percent-encoding = "2"
toml.workspace = true
sha2 = "0.10"
dirs = "6"

connector = { path = "../../../connector" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography"] }
