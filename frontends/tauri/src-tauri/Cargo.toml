[package]
name = "tauri-frontend"
version.workspace = true
edition.workspace = true
default-run = "LLM-Nest"

[[bin]]
name = "LLM-Nest"
path = "src/main.rs"

[lib]
name = "tauri_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
open = { version = "5", features = ["shellexecute-on-windows"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tokio-util.workspace = true
uuid.workspace = true

social-feature = { path = "../../../features/social" }
social.workspace = true
runtime = { path = "../../../crates/runtime" }
events = { path = "../../../crates/events" }
ai-client.workspace = true
storage.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
