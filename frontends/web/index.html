<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Runs before styles/modules, so the native glass is visible on first paint.
      if (window.isTauri) document.documentElement.classList.add("desktop-starting")
      try {
        const theme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("llm-nest-theme") || "dark"
        document.documentElement.classList.toggle("dark", theme === "dark")
      } catch { document.documentElement.classList.add("dark") }
    </script>
    <style>
      html.desktop-starting, .desktop-starting body { margin: 0; background: transparent !important; }
    </style>
    <title>LLM Nest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
