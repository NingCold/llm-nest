[workspace]
resolver = "2"
members = ["desktop/src-tauri"]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/NingCold/llm-nest"
version = "0.1.1-alpha.12"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.dependencies.connector]
git = "https://github.com/NingCold/llm-nest-server.git"
rev = "f47f9b4a99ba8602b7992b53d22bacf08534a64c"
